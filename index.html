<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 Korea Expo in LA - Directory</title>
  <style>
    :root {
      --navy: #000000;
      --orange: #FF8500;
      --sky: #eef4ff;
      --line: #e6eaf0;
      --text: #000000;
      --muted: #6f7a89;
      --white: #ffffff;
      --green: #17865c;
      --shadow: 0 18px 50px rgba(25, 49, 88, 0.10);
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--text);
      background: #f7f9fc;
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", "PingFang SC",
        -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, select { font: inherit; }

    a { color: inherit; text-decoration: none; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: 72px;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(16,35,63,.08);
    }

    .topbar-inner {
      width: min(1200px, calc(100% - 40px));
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      color: var(--navy);
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 13px;
      letter-spacing: .08em;
      background: linear-gradient(145deg, #1948d8, #3b82f6);
      box-shadow: 0 8px 22px rgba(39,100,255,.28);
    }

    .nav {
      display: flex;
      gap: 24px;
      color: #465264;
      font-size: 14px;
      font-weight: 650;
    }

    .hero-inner {
      width: min(1200px, calc(100% - 40px));
      min-height: 470px;
      margin: 0 auto;
      padding: 78px 0 72px;
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      align-items: center;
      gap: 60px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.24);
      background: rgba(255,255,255,.09);
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #8ec5ff;
      box-shadow: 0 0 0 6px rgba(142,197,255,.12);
    }

    .hero h1 {
      margin: 24px 0 18px;
      max-width: 770px;
      font-size: clamp(42px, 6vw, 76px);
      line-height: .98;
      letter-spacing: -.045em;
    }

    .hero h1 span {
      display: block;
      margin-top: 13px;
      color: #b8d4ff;
      font-size: .47em;
      letter-spacing: -.01em;
      line-height: 1.15;
    }

    .hero-copy {
      max-width: 660px;
      margin: 0;
      color: rgba(255,255,255,.76);
      font-size: 16px;
      line-height: 1.8;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }

    .hero-btn {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border-radius: 999px;
      font-weight: 750;
      font-size: 14px;
      border: 1px solid rgba(255,255,255,.25);
    }

    .hero-btn.primary {
      background: white;
      color: var(--navy);
      border-color: white;
    }

    .hero-btn.secondary { background: rgba(255,255,255,.08); }

    .hero-panel {
      position: relative;
      min-height: 300px;
      display: grid;
      place-items: center;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(.2px);
    }

    .orb.one {
      width: 270px;
      height: 270px;
      background: linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.03));
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: inset 0 0 80px rgba(255,255,255,.08);
    }

    .orb.two {
      width: 155px;
      height: 155px;
      transform: translate(102px, -77px);
      background: rgba(88,159,255,.22);
      border: 1px solid rgba(255,255,255,.18);
    }

    .stats-wrap {
      width: min(1200px, calc(100% - 40px));
      margin: 27px auto 0;
      position: relative;
      z-index: 5;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      background: white;
      border: 1px solid rgba(16,35,63,.07);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .stat {
      padding: 24px 26px;
      border-right: 1px solid var(--line);
    }

    .stat:last-child { border-right: 0; }

    .stat b {
      display: block;
      color: var(--navy);
      font-size: 25px;
      letter-spacing: -.03em;
    }

    .stat span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .section {
      width: min(1200px, calc(100% - 40px));
      margin: 0 auto;
      padding: 84px 0 20px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .section-kicker {
      color: var(--orange);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .section h2 {
      margin: 8px 0 0;
      color: var(--navy);
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: -.035em;
    }

    .section-desc {
      max-width: 450px;
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .search-panel {
      padding: 22px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 12px 36px rgba(34,56,96,.07);
    }

    .search-row {
      display: grid;
      grid-template-columns: 2.5fr 1fr;
      gap: 12px;
    }

    .field {
      height: 50px;
      width: 100%;
      padding: 0 15px;
      border: 1px solid #dfe5ed;
      border-radius: 13px;
      outline: none;
      color: var(--text);
      background: #fbfcfe;
    }

    .field:focus {
      border-color: rgba(39,100,255,.7);
      box-shadow: 0 0 0 4px rgba(39,100,255,.08);
    }

    .results-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 24px 2px 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .results-line strong { color: var(--navy); }

    .company-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

.company-card {
  background: white;
  border: 1px solid #e7ebf0;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(20, 40, 70, 0.05);
}

    .company-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 46px rgba(35,63,110,.12);
      border-color: rgba(39,100,255,.22);
    }

    .visual {
    position: relative;
    height: 265px;
    padding: 70px 20px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #ffffff;
    border-bottom: 1px solid var(--line);
    }

.visual::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 7px;
  border-radius: 0;
}

.visual::after {
  display: none;
}

.visual.beauty::before {
  background: #f6c7d9;
}

.visual.food::before {
  background: #bfe7d6;
}

.visual.lifestyle::before {
  background: #f5dda2;
}

.visual.industry::before {
  background: #d7dee7;
}

.main-product-image {
  position: relative;
  width: 100%;
  height: 100%;
  max-width: 280px;
  object-fit: contain;
  padding: 10px;
}

    .initials{
    position:relative;
    z-index:1;
    font-size:32px;
    font-weight:900;
    line-height:1.15;
    color:var(--navy);
    white-space:pre-line;
    word-break:break-word;
    max-width:85%;
    }

    .company-card-header {
    position: absolute;
    top: 33px;
    left: 24px;
    right: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 3;
    }

    .booth {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 5px 10px;
    background: #f3f5f8;
    border: 1px solid #e3e7ed;
    border-radius: 999px;
    color: #596579;
    font-size: 11px;
    font-weight: 800;
    line-height: 1;
    white-space: nowrap;
    }

    .main-company-name {
    min-width: 0;
    color: #111827;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    }

    .card-body {
      padding: 22px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .category {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .category span {
      display: inline-block;
      color: var(--orange);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .company-name {
      margin: 8px 0 12px;
      color: var(--navy);
      font-size: 18px;
      font-weight: 700;
      line-height: 1.5;
      white-space: pre-line;
    }

    .products {
      margin: 17px 0 18px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
      min-height: 44px;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: auto;
      padding-top: 18px;
    }

    .btn {
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 800;
      font-size: 15px;
      text-align: center;
      line-height: 1.2;
    }

    .btn.primary {
  background: #eef4ff;
  color: var(--navy);
  border: 1px solid #d7e4ff;
    }

    .btn.ghost {
      min-width: 42px;
      color: var(--navy);
      background: #f1f5fa;
    }

    .btn.apply {
      background: var(--navy);
      color: #fff;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 70px 20px;
      text-align: center;
      color: var(--muted);
      background: white;
      border: 1px dashed #ccd5e2;
      border-radius: 22px;
    }

    .footer {
      margin-top: 100px;
      padding: 44px 20px;
      color: rgba(255,255,255,.66);
      background: var(--navy);
      text-align: center;
      font-size: 13px;
    }

    .footer b {
      display: block;
      margin-bottom: 7px;
      color: white;
      font-size: 16px;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(8,18,34,.64);
      backdrop-filter: blur(8px);
    }

    .modal.open { display: flex; }

    .modal-box {
      width: min(980px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: white;
      border-radius: 26px;
      box-shadow: 0 30px 100px rgba(0,0,0,.3);
    }

    .modal-head {
      position: sticky;
      top: 0;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }

    .modal-head b { color: var(--navy); }

    .close {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      color: var(--navy);
      background: #f0f3f7;
      font-size: 20px;
    }

    .detail-hero {
      padding: 38px;
      color: white;
      background:
        linear-gradient(135deg, #FF8500 0%, #FF8500 100%);
    }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 15px;
    }

    .detail-chip {
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.10);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 750;
    }

    .detail-hero h3 {
      margin: 0;
      font-size: clamp(29px, 5vw, 48px);
      letter-spacing: -.04em;
      color: 255,255,255,.82;
    }

    .detail-hero p {
      max-width: 680px;
      margin: 14px 0 0;
      color: rgba(255,255,255,.75);
      line-height: 1.7;
    }

    .detail-content { padding: 34px 38px 42px; }

    .detail-section + .detail-section {
      margin-top: 38px;
      padding-top: 34px;
      border-top: 1px solid var(--line);
    }

    .detail-section h4 {
      margin: 0 0 18px;
      color: var(--navy);
      font-size: 20px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .info-item {
      min-height: 102px;
      padding: 18px;
      background: #f7f9fc;
      border: 1px solid #edf0f4;
      border-radius: 15px;
    }

    .info-item small {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .info-item div {
      color: #2a3442;
      line-height: 1.6;
      font-size: 14px;
    }

    .product-list {
      display: block;
    }

    .product-card {
      display: grid;
      grid-template-columns: minmax(260px, 38%) 1fr;
      gap: 30px;
      align-items: center;
      width: 100%;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
    }

    .product-image {
      width: 100%;
      height: 280px;
      object-fit: contain;
      display: block;
      margin: 0;
      padding: 12px;
      background: #f7f9fc;
      border-radius: 15px;
    }

    .product-info {
      min-width: 0;
    }

    .product-card h5 {
      margin: 0 0 14px;
      color: var(--navy);
      font-size: 21px;
      line-height: 1.45;
    }

    .product-card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-line;
    }

    .certs {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }

    .cert {
      padding: 6px 9px;
      color: #422300;
      background: #FFD4A6;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
    }

    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }

    .detail-actions a {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      padding: 0 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
    }

    .detail-actions .web {
      color: white;
      background: var(--orange);
    }

    .detail-actions .catalog {
      color: var(--navy);
      background: #eef2f7;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 34px;
    }

    .page-btn {
      min-width: 40px;
      height: 40px;
      padding: 0 12px;
      border: 1px solid #dfe5ed;
      border-radius: 10px;
      background: #ffffff;
      color: #111827;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .page-btn:hover:not(:disabled) {
      border-color: #111827;
    }

    .page-btn.active {
      background: #111827;
      border-color: #111827;
      color: #ffffff;
    }

    .page-btn:disabled {
      opacity: .35;
      cursor: default;
    }

    @media (max-width: 900px) {
      .nav { display: none; }
      .hero-inner { grid-template-columns: 1fr; min-height: auto; }
      .hero-panel { display: none; }
      .stats {grid-template-columns: repeat(2, 1fr);}
      .stat {border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);}
      .stat:nth-child(2n) {border-right: 0;}
      .company-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 620px) {
      .topbar-inner, .hero-inner, .stats-wrap, .section {
        width: min(100% - 24px, 1200px);
      }
      .hero-inner { padding: 58px 0 65px; }
      .hero h1 { font-size: 44px; }
      .stats { grid-template-columns: 1fr 1fr; }
      .stat { padding: 19px 16px; }
      .section { padding-top: 62px; }
      .section-head { align-items: flex-start; flex-direction: column; }
      .company-grid { grid-template-columns: 1fr; }
      .info-grid, .product-list { grid-template-columns: 1fr; }
      .detail-hero, .detail-content { padding-left: 22px; padding-right: 22px; }
      .search-row {grid-template-columns: 1fr;}
      .product-card {grid-template-columns: 1fr; gap: 20px;}
      .product-image {height: 240px;}
    }
  </style>
</head>
<body>

  <div class="stats-wrap">
    <div class="stats" id="statsContainer"></div>
  </div>

  <main id="companies" class="section">
    <div class="section-head">
      <div>
        <div class="section-kicker">KITA COMPANIES</div>
        <h2>Company Directory</h2>
      </div>
      <p class="section-desc">
        
      </p>
    </div>

    <div class="search-panel">
      <div class="search-row">
        <input
          id="searchInput"
          class="field"
          type="search"
          placeholder="Please search ..."/>

        <select id="CategoryFilter" class="field">
          <option value="">All</option>
        </select>

      </div>
    </div>

    <div class="results-line">
      <span>Results：<strong id="resultCount">0</strong> products</span>
      <span>Click to view detailed information.</span>
    </div>

    <div id="companyGrid" class="company-grid">
      <div class="empty">Loading directory...</div>
    </div>
  </main>

  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-box">
      <div class="modal-head">
        <b>Detailed Information</b>
        <button class="close" type="button" onclick="closeModal()" aria-label="Close">×</button>
      </div>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>

    let companies = [];

    let currentPage = 1;
    const ITEMS_PER_PAGE = 9;

    const CATEGORY_ORDER = {
      "K-Beauty": 1,
      "K-Food": 2,
      "K-Lifestyle": 3
    };

    function getCategoryOrder(category) {
      const categories = String(category || "")
        .split(",")
        .map(item => item.trim())
        .filter(Boolean);

      if (!categories.length) return 999;

      return Math.min(
        ...categories.map(item => CATEGORY_ORDER[item] || 999)
      );
    }

    fetch("./companies.json", { cache: "no-cache" })
  .then(res => {
    if (!res.ok) {
      throw new Error(`HTTP error: ${res.status}`);
    }
    return res.json();
  })
  .then(data => {
    console.log("DIRECTORY DATA:", data);

    if (!Array.isArray(data)) {
      throw new Error("companies.json must contain a JSON array.");
    }

    companies = data;
    initialize();
  })
  .catch(error => {
    console.error("DATA LOAD ERROR:", error);

    grid.innerHTML = `
      <div class="empty">
        Failed to load data.
      </div>
    `;
  });

      const grid = document.getElementById("companyGrid");
      const searchInput = document.getElementById("searchInput");
      const CategoryFilter = document.getElementById("CategoryFilter");
      const resultCount = document.getElementById("resultCount");
      const modal = document.getElementById("modal");
      const modalContent = document.getElementById("modalContent");

    function renderCompanies() {
      const keyword = searchInput.value.trim().toLowerCase();
      const category = CategoryFilter.value;

      const filtered = companies.filter(company => {
        const productText = (company.products || [])
          .map(product => `${product.name || ""} ${product.description || ""}`)
          .join(" ");

        const searchable = `
         ${company.name}
         ${company.category || ""}
         ${company.industry || ""}
         ${company.subcategory || ""}
         ${productText}
       `.toLowerCase();

        const matchesKeyword = !keyword || searchable.includes(keyword);
        const companyCategories = (company.category || "")
          .split(",")
          .map(item => item.trim());

        const matchesIndustry =
          !category || companyCategories.includes(category);
          
        return matchesKeyword && matchesIndustry;
      });
      resultCount.textContent = filtered.length;

      if (!filtered.length) {
        grid.innerHTML = `<div class="empty">meiyou zhaodao fuhe tiaojiande qiye</div>`;
        return;
      }

      const filteredProducts = filtered.flatMap(company =>
        (company.products || []).map((product, productIndex) => ({
          company,
          product,
          productIndex
        }))
      );

      filteredProducts.sort((a, b) => {
        return (
          getCategoryOrder(a.company.category) -
          getCategoryOrder(b.company.category)
        );
      });

      resultCount.textContent = filteredProducts.length;

      if (!filteredProducts.length) {
        grid.innerHTML = `<div class="empty">No matching products found.</div>`;
        return;
      }

      const totalPages = Math.ceil(
        filteredProducts.length / ITEMS_PER_PAGE
      );

      if (currentPage > totalPages) {
        currentPage = totalPages;
      }

      if (currentPage < 1) {
        currentPage = 1;
      }

      const startIndex =
        (currentPage - 1) * ITEMS_PER_PAGE;

      const paginatedProducts =
        filteredProducts.slice(
          startIndex,
          startIndex + ITEMS_PER_PAGE
        );

      grid.innerHTML = paginatedProducts.map(
        ({ company, product, productIndex }) => `
  <article class="company-card">

    <div class="visual ${getVisualClass(
      (company.category || "").split(",")[0].trim()
    )}">

      <div class="company-card-header">

        ${company.booth
          ? `<span class="booth">${company.booth}</span>`
          : ""
        }

        <div class="main-company-name">
          ${company.name || ""}
        </div>

      </div>

      <img
        class="main-product-image"
        src="${product.imageUrl || ""}"
        alt="${product.name || ""}"
        loading="lazy"
        decoding="async"
        onerror="this.style.display='none'"
      >

    </div>

    <div class="card-body">

      <div class="category">
        ${(company.category || "")
          .split(",")
          .map(category => `<span>${category.trim()}</span>`)
          .join("")}
      </div>

      <h3 class="company-name">
        ${product.name || ""}
      </h3>

      <div class="card-actions">

        ${product.meetingRequest
          ? `<a
              class="btn apply"
              href="${product.meetingRequest}"
              target="_blank"
              rel="noopener noreferrer"
            >
              Meeting Request
            </a>`
          : ""
        }

        <button
          class="btn primary"
          type="button"
          onclick='openModal(${JSON.stringify(company.id)}, ${productIndex})'
        >
          View Details
        </button>

      </div>

    </div>
  </article>
`).join("");

renderPagination(totalPages);

      function getVisualClass(category) {
        switch ((category || "").trim()) {
          case "K-Beauty":
            return "beauty";

          case "K-Food":
            return "food";

          case "K-Lifestyle":
            return "lifestyle";

          default:
            return "industry";
        }
      }
    }


    function renderPagination(totalPages) {
      let pagination = document.getElementById("pagination");

      if (!pagination) {
        pagination = document.createElement("div");
        pagination.id = "pagination";
        pagination.className = "pagination";

        grid.insertAdjacentElement(
          "afterend",
          pagination
        );
      }

      if (totalPages <= 1) {
        pagination.innerHTML = "";
        return;
      }

      let html = "";

      html += `
        <button
          class="page-btn"
          ${currentPage === 1 ? "disabled" : ""}
          onclick="changePage(${currentPage - 1})"
        >
          ‹
        </button>
      `;

      for (let page = 1; page <= totalPages; page++) {
        html += `
          <button
            class="page-btn ${page === currentPage ? "active" : ""}"
            onclick="changePage(${page})"
          >
            ${page}
          </button>
        `;
      }

      html += `
        <button
          class="page-btn"
          ${currentPage === totalPages ? "disabled" : ""}
          onclick="changePage(${currentPage + 1})"
        >
          ›
        </button>
      `;

      pagination.innerHTML = html;
    }

    function changePage(page) {
      currentPage = page;
      renderCompanies();

      document
        .getElementById("companies")
        .scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
    }
    function removeKoreanParentheses(value) {
      return String(value || "")
        .replace(/\s*\([^)]*[가-힣][^)]*\)/g, "")
        .trim();
    }

    function openModal(id, productIndex) {
  const company = companies.find(item => item.id === id);
  if (!company) return;

  const product = (company.products || [])[productIndex];
  if (!product) return;


  modalContent.innerHTML = `
    <section class="detail-hero">

      <div class="detail-meta">

          ${company.booth
             ? `<span class="detail-chip">${company.booth}</span>`
             : ""
           }

        ${(company.category || "")
          .split(",")
          .map(category => `
            <span class="detail-chip">${category.trim()}</span>
          `)
          .join("")}

      </div>

      <h3>${company.name}</h3>
      <p>${company.description || ""}</p>

    </section>


    <div class="detail-content">

      <section class="detail-section">

        <h4>Company Information</h4>

        <div class="info-grid">

          <div class="info-item">
            <small>Business Type</small>
            <div>${removeKoreanParentheses(company.industry) || "-"}</div>
          </div>

          <div class="info-item">
            <small>OEM / ODM</small>
            <div>${removeKoreanParentheses(company.oemOdm) || "-"}</div>
          </div>

        </div>

        <div class="detail-actions">

          ${company.websites && company.websites.length
            ? company.websites
                .map((website, index) => `
                  <a
                    class="web"
                    href="${website}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    ${company.websites.length > 1
                      ? `Website ${index + 1} ↗`
                      : "Website ↗"
                    }
                  </a>
                `)
                .join("")
            : ""
          }

          ${company.catalogs && company.catalogs.length
            ? company.catalogs
                .map((catalog, index) => `
                  <a
                    class="catalog"
                    href="${catalog}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    ${company.catalogs.length > 1
                      ? `E-Catalog ${index + 1} ↗`
                      : "E-Catalog ↗"
                    }
                  </a>
                `)
                .join("")
            : ""
          }

        </div>

      </section>


      <section class="detail-section">

        <h4>Product Information</h4>

        <div class="product-list">

          <article class="product-card">
            <img
              class="product-image"
              src="${product.imageUrl || ""}"
              alt="${product.name || ""}"
              loading="lazy"
              decoding="async"
              onerror="this.style.display='none'"
            >

            <div class="product-info">

              <h5>${product.name || ""}</h5>

              <p>${product.description || "-"}</p>

              ${product.certs && product.certs.length ? ` <div class="certs"> ${product.certs
                      .map(cert => `<span class="cert">${cert}</span>`)
                      .join("")}
                  </div>
                `
                : ""
              }

            </div>

          </article>

        </div>

      </section>

    </div>
  `;

  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
}

    function closeModal() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    modal.addEventListener("click", event => {
      if (event.target === modal) closeModal();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeModal();
    });

    searchInput.addEventListener("input", () => {
      currentPage = 1;
      renderCompanies();
    });

    CategoryFilter.addEventListener("change", () => {
      currentPage = 1;
      renderCompanies();
    });

    function renderStats() {
      const statsContainer = document.getElementById("statsContainer");

      const categoryCounts = companies.reduce((counts, company) => {
        const categories = (company.category || "Others")
          .split(",")
          .map(category => category.trim())
          .filter(Boolean);

        categories.forEach(category => {
          counts[category] = (counts[category] || 0) + 1;
        });

        return counts;
      }, {});

      const categoryStats = Object.entries(categoryCounts)
        .sort((a, b) => b[1] - a[1])
        .map(([category, count]) => `
          <div class="stat">
            <b>${count}</b>
            <span>${category}</span>
          </div>
        `)
        .join("");

      statsContainer.innerHTML = `
        <div class="stat">
          <b>${companies.length}</b>
          <span>All Companies</span>
        </div>

        ${categoryStats}
      `;
    }
    function initialize() {
      const categories = [...new Set(
        companies
          .flatMap(company =>
            (company.category || "")
              .split(",")
              .map(category => category.trim())
              .filter(Boolean)
          )
      )];

      CategoryFilter.innerHTML = `
        <option value="">All</option>
        ${categories
          .map(category => `
            <option value="${category}">${category}</option>
          `)
          .join("")}
      `;

      renderStats();
      renderCompanies();
    }

  </script>
</body>
</html>
